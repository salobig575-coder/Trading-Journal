<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0a08" media="(prefers-color-scheme: dark)">
<meta name="description" content="Trading Journal 2026: Trades, Analysen, Statistiken, Routine und Trading-Model-Checklisten.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/logo-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="icons/logo-light.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    try {
      var pal = localStorage.getItem('palette');
      if (pal === 'classic') document.documentElement.setAttribute('data-palette', 'classic');
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--accent-2)"/>
      <stop offset="1" style="stop-color:var(--accent)"/>
    </linearGradient>
  </defs>
</svg>

<div id="splash">
  <div class="splash-logo">
    <img class="logo-l" src="icons/logo-light.svg" alt="" width="112" height="112">
    <img class="logo-d" src="icons/logo-dark.svg" alt="" width="112" height="112">
  </div>
  <div class="splash-name">Trading <span>Journal</span></div>
</div>

<!-- Kompakte Glas-Leiste: erscheint, sobald der grosse Titel aus dem Bild scrollt -->
<div id="navbar" class="navbar" aria-hidden="true">
  <div class="navbar-in">
    <button id="navBack" class="nb hidden" aria-label="Zurück"></button>
    <div id="navTitle" class="nt"></div>
    <span></span>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="title-wrap">
      <button id="backBtn" class="round-btn" aria-label="Zurück"></button>
      <div class="brand" aria-hidden="true">
        <img class="logo-l" src="icons/logo-light.svg" alt="" width="44" height="44">
        <img class="logo-d" src="icons/logo-dark.svg" alt="" width="44" height="44">
      </div>
      <div style="min-width:0">
        <div class="overline" id="pageSub"></div>
        <h1 id="pageTitle">Heute</h1>
      </div>
    </div>
    <button id="settingsBtn" class="round-btn" aria-label="Einstellungen"></button>
  </header>
  <main id="view"></main>
</div>

<nav class="dock" aria-label="Hauptnavigation">
  <div class="side-brand" aria-hidden="true">
    <span class="side-logo"><img class="logo-l" src="icons/logo-light.svg" alt="" width="36" height="36"><img class="logo-d" src="icons/logo-dark.svg" alt="" width="36" height="36"></span>
    <span class="side-name">Trading <span>Journal</span></span>
  </div>
  <div class="dock-in">
    <button class="tab" data-route="home"><span class="ic"></span>Heute</button>
    <button class="tab" data-route="journal"><span class="ic"></span>Journal</button>
    <button class="fab" id="fab" aria-label="Neu erfassen"></button>
    <button class="tab" data-route="routine"><span class="ic"></span>Routine</button>
    <button class="tab" data-route="stats"><span class="ic"></span>Statistik</button>
  </div>
  <div class="side-hint" aria-hidden="true"><kbd>?</kbd> Tastenkürzel</div>
</nav>

<script src="js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/options.js"></script>
<script src="js/config.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/fx.js"></script>
<script src="js/seed.js"></script>
<script src="js/habits.js"></script>
<script src="js/routine.js"></script>
<script src="js/journal.js"></script>
<script src="js/propaccounts.js"></script>
<script src="js/analysis.js"></script>
<script src="js/collections.js"></script>
<script src="js/tools.js"></script>
<script src="js/stats.js"></script>
<script src="js/home.js"></script>
<script src="js/privacy.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/importer.js"></script>
<script src="js/settings.js"></script>
<script src="js/sync.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/haptics.js"></script>
<script src="js/swipe.js"></script>
<script src="js/art.js"></script>
<script src="js/dictate.js"></script>
<script>
  App.init();
</script>
</body>
</html>
